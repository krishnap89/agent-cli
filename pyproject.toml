[project]
name = "agent-cli"
version = "0.1.0"
description = "A minimal coding agent for local OpenAI-compatible LLMs"
requires-python = ">=3.9"
dependencies = ["typer>=0.12", "rich>=13", "prompt_toolkit>=3.0"]

[project.optional-dependencies]
treesitter = ["tree-sitter>=0.23", "tree-sitter-kotlin>=1.1", "tree-sitter-swift>=0.0.1"]

[project.scripts]
agent = "agent_cli.main:app"
coder = "agent_cli.coder:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_cli"]
